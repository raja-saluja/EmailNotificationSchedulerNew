name: Deploy Scheduler

on:
  push:
    branches:
      - main

env:
  SOLUTION_PATH: EmailNotificationNew.sln
  PROJECT_PATH: EmailNotificationNew.csproj
  DEPLOY_PATH: E:\Apps\Schedulers\EmailNotificationNew
  TASK_NAME: EmailNotificationScheduler

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore ${{ env.SOLUTION_PATH }}

      - name: Build Solution
        run: |
          msbuild ${{ env.SOLUTION_PATH }} `
          /p:Configuration=Release

      - name: Stop Existing Process
        shell: powershell
        run: |
          Get-Process EmailNotificationNew -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Create Deploy Directory
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ env.DEPLOY_PATH }}"

      - name: Deploy Files
        shell: powershell
        run: |
          $source = ".\bin\Release"
          $target = "${{ env.DEPLOY_PATH }}"

          robocopy `
            $source `
            $target `
            /E `
            /IS `
            /IT

          if ($LASTEXITCODE -le 3) {
            exit 0
          } else {
            exit $LASTEXITCODE
          }

      - name: Create run.ps1
        shell: powershell
        run: |
          @"
          cd "${{ env.DEPLOY_PATH }}"
          .\EmailNotificationNew.exe
          "@ | Out-File `
            "${{ env.DEPLOY_PATH }}\run.ps1" `
            -Encoding utf8

      - name: Create or Update Scheduled Task
        shell: powershell
        run: |

          $taskName = "${{ env.TASK_NAME }}"

          $action = New-ScheduledTaskAction `
            -Execute "powershell.exe" `
            -Argument "-ExecutionPolicy Bypass -File `"${{ env.DEPLOY_PATH }}\run.ps1`""

          $trigger = New-ScheduledTaskTrigger `
            -Once `
            -At (Get-Date) `
            -RepetitionInterval (New-TimeSpan -Hours 1)

          $settings = New-ScheduledTaskSettingsSet `
            -AllowStartIfOnBatteries `
            -DontStopIfGoingOnBatteries `
            -StartWhenAvailable

          $existingTask = Get-ScheduledTask `
            -TaskName $taskName `
            -ErrorAction SilentlyContinue

          if ($existingTask) {

            Unregister-ScheduledTask `
              -TaskName $taskName `
              -Confirm:$false

          }

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -Settings $settings `
            -User "SYSTEM" `
            -RunLevel Highest `
            -Force

      - name: Start Scheduled Task
        shell: powershell
        run: |
          Start-ScheduledTask `
            -TaskName "${{ env.TASK_NAME }}"
